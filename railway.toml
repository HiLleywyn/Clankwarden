[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

# The framework lives in a private repo, so the image needs a read token at
# build time. Set FRAMEWORK_REF / GITHUB_TOKEN as Railway build variables.
[build.args]
FRAMEWORK_REF = "main"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
